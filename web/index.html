<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sermon Processor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: work column (video, outputs, send) beside a narrow recent-runs rail; stacks on phones. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --sunk: #eef0f4; --fg: #1d2330; --muted: #5d6676; --line: #d8dce4;
  --accent: #d9711c; --accent-fg: #ffffff; --ok: #1f8a5b; --warn: #a86400; --bad: #b4362f; --run: #2d6fb8;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --surface: #1a1f28; --sunk: #141820; --fg: #e8ebf1; --muted: #9aa3b2; --line: #2e3542;
    --accent: #f09a4f; --accent-fg: #1a1208; --ok: #4cc48d; --warn: #e3a64a; --bad: #ee7a72; --run: #6fa8ec;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
input:disabled { opacity: .45; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
h2 { margin: 0; font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
a { color: var(--run); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.stack { display: grid; gap: 20px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); font-weight: 500; min-width: 0; }
input, select { font: inherit; color: var(--fg); background: var(--sunk); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; min-width: 0; width: 100%; }
input.time { font-family: var(--mono); font-size: .9rem; }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[aria-invalid="true"] { border-color: var(--bad); }
button { font: inherit; font-weight: 600; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); padding: 11px 20px; }
button.primary:disabled { opacity: .45; cursor: not-allowed; }
button.link { border: 0; background: none; padding: 4px 6px; color: var(--muted); font-weight: 500; }
button.link:hover { color: var(--bad); }
.check { display: flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--fg); font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.video-pick { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 16px; align-items: start; }
@media (max-width: 600px) { .video-pick { grid-template-columns: minmax(0, 1fr); } }
.meta { font-family: var(--mono); font-size: .78rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.thumb { aspect-ratio: 16 / 9; width: 100%; max-width: 100%; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line);
  display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: .8rem; text-align: center; padding: 6px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.missing { border-style: dashed; color: var(--warn); }

.output { border: 1px solid var(--line); border-radius: 9px; padding: 14px; display: grid; gap: 12px; background: var(--surface); }
.output-head { display: flex; gap: 10px; align-items: end; }
.output-head label { flex: 1; }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 120px)) minmax(0, 1fr); gap: 10px; align-items: end; }
.grid-g { display: grid; grid-template-columns: 96px minmax(0, 1fr) repeat(2, minmax(0, 110px)); gap: 10px; align-items: end; }
@media (max-width: 640px) { .grid4, .grid-g { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .grid-g .gprev { grid-row: span 2; } }
.gprev { aspect-ratio: 16 / 9; border-radius: 6px; background: var(--sunk); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: .7rem; }
.gprev img { width: 100%; height: 100%; object-fit: cover; }
.length { font-family: var(--mono); font-size: .8rem; color: var(--muted); padding-bottom: 9px; }
.errors { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.errors li { color: var(--bad); font-size: .85rem; }
.errors li::before { content: "• "; }

.runs { display: grid; gap: 8px; }
.run { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.run .title { font-weight: 600; font-size: .9rem; overflow-wrap: anywhere; }
.run .when { font-size: .78rem; color: var(--muted); grid-column: 1; }
.run a { font-size: .8rem; grid-column: 2; grid-row: 2; justify-self: end; }
.chip { font-family: var(--mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 99px;
  border: 1px solid currentColor; align-self: start; white-space: nowrap; }
.chip.queued, .chip.in_progress, .chip.waiting, .chip.pending, .chip.requested { color: var(--run); }
.chip.success { color: var(--ok); }
.chip.failure, .chip.cancelled, .chip.timed_out { color: var(--bad); }
.empty { color: var(--muted); font-size: .9rem; }
.notice { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); font-size: .9rem; }
.notice.bad { border-color: var(--bad); color: var(--bad); }
.notice.ok { border-color: var(--ok); color: var(--ok); }

.gate { max-width: 360px; margin: 12vh auto 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: no-preference) { button, input, select { transition: border-color .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <form id="gate" class="panel gate" hidden>
    <h1>Sermon <span>Processor</span></h1>
    <label for="passcode">Passcode
      <input id="passcode" type="password" autocomplete="current-password" required>
    </label>
    <div id="gate-msg" class="notice bad" hidden></div>
    <button class="primary" type="submit">Open</button>
  </form>

  <div id="app" hidden>
    <header>
      <h1>Sermon <span>Processor</span></h1>
      <div class="row">
        <a id="output-link" href="#" target="_blank" rel="noopener" hidden>Open Output folder</a>
        <button class="link" type="button" id="lock">Lock</button>
      </div>
    </header>

    <div class="layout">
      <div class="stack">
        <section class="panel" aria-labelledby="h-video">
          <div class="row spread"><h2 id="h-video">Video</h2><button type="button" id="refresh">Refresh list</button></div>
          <div id="files-msg" class="notice" hidden></div>
          <div class="video-pick">
            <div class="stack" style="gap:10px">
              <label for="video">From the Incoming folder, newest first
                <select id="video"></select>
              </label>
              <div class="meta" id="video-meta"></div>
            </div>
            <div class="thumb" id="video-thumb">No video picked</div>
          </div>
        </section>

        <section class="panel" aria-labelledby="h-out">
          <div class="row spread"><h2 id="h-out">Outputs</h2><button type="button" id="add">+ Add output</button></div>
          <div id="outputs" class="stack" style="gap:12px"></div>
        </section>

        <section class="panel" aria-labelledby="h-send">
          <h2 id="h-send" class="sr">Send</h2>
          <div class="row spread">
            <label for="height" style="max-width:240px">Resolution
              <select id="height">
                <option value="1080">1080p (faster)</option>
                <option value="source">Same as the video (4K stays 4K)</option>
              </select>
            </label>
            <button class="primary" type="button" id="send">Send to render</button>
          </div>
          <ul class="errors" id="errors"></ul>
          <div id="send-msg" class="notice" hidden></div>
        </section>
      </div>

      <aside class="panel" aria-labelledby="h-runs">
        <div class="row spread"><h2 id="h-runs">Recent runs</h2><button class="link" type="button" id="runs-refresh">Refresh</button></div>
        <div id="runs" class="runs"><p class="empty">Loading…</p></div>
      </aside>
    </div>
  </div>
</div>

<template id="output-tpl">
  <div class="output">
    <div class="output-head">
      <label>Name (used in the file name)
        <input class="o-name" maxlength="60">
      </label>
      <button type="button" class="link o-remove">Remove</button>
    </div>
    <div class="grid4">
      <label>In
        <input class="o-in time" placeholder="2:45" inputmode="decimal">
      </label>
      <label>Out
        <input class="o-out time" placeholder="41:27 or end" inputmode="decimal">
      </label>
      <div class="length o-length"></div>
    </div>
    <div class="grid-g">
      <div class="gprev o-gprev">None</div>
      <label>End graphic
        <select class="o-graphic"></select>
      </label>
      <label>Show for (s)
        <input class="o-seconds" type="number" min="0.1" step="0.1" value="5">
      </label>
      <label>Crossfade (s)
        <input class="o-fade" type="number" min="0" step="0.1" value="1">
      </label>
    </div>
    <label class="check"><input type="checkbox" class="o-podcast"> Also make the podcast audio (MP3)</label>
  </div>
</template>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let passcode = store.get("sp-passcode");
let files = { videos: [], graphics: [] };
let runsTimer = null;

// ---------- api
async function api(path, init = {}) {
  const r = await fetch(path, { ...init, headers: { "x-passcode": passcode, ...(init.body ? { "content-type": "application/json" } : {}) } });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { lock("That passcode didn't work."); throw new Error("locked"); }
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}
const img = (id) => `/api/image/${encodeURIComponent(id)}?k=${encodeURIComponent(passcode)}`;

// ---------- time helpers
function parseTime(text) {
  const t = String(text).trim().toLowerCase();
  if (!t) return null;
  if (t === "end") return "end";
  if (/^\d+(\.\d+)?$/.test(t)) return Number(t);
  const m = t.match(/^(?:(\d+):)?(\d+):(\d{1,2}(?:\.\d+)?)$/);
  if (!m) return null;
  const [, h, mm, ss] = m;
  if (Number(ss) >= 60 || (h && Number(mm) >= 60)) return null;
  return Number(h || 0) * 3600 + Number(mm) * 60 + Number(ss);
}
function fmt(sec) {
  if (sec == null || isNaN(sec)) return "–";
  const s = Math.round(sec * 10) / 10, h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  const ss = (r < 10 ? "0" : "") + (Number.isInteger(r) ? r : r.toFixed(1));
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
const size = (b) => b >= 1 << 30 ? `${(b / (1 << 30)).toFixed(1)} GB` : `${Math.round(b / 1048576)} MB`;
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return new Date(iso).toLocaleDateString();
}

// ---------- gate
function lock(msg) {
  passcode = ""; store.del("sp-passcode");
  $("#app").hidden = true; $("#gate").hidden = false;
  $("#gate-msg").hidden = !msg; $("#gate-msg").textContent = msg || "";
  clearInterval(runsTimer);
  $("#passcode").focus();
}
$("#gate").addEventListener("submit", (e) => {
  e.preventDefault();
  passcode = $("#passcode").value.trim();
  store.set("sp-passcode", passcode);
  start();
});
$("#lock").addEventListener("click", () => lock(""));

// ---------- files
async function loadFiles() {
  const msg = $("#files-msg");
  msg.hidden = false; msg.className = "notice"; msg.textContent = "Reading your Drive…";
  try {
    files = await api("/api/files");
    msg.hidden = true;
  } catch (e) {
    if (e.message === "locked") return;
    msg.className = "notice bad"; msg.textContent = e.message; return;
  }
  const keep = $("#video").value;
  $("#video").innerHTML = files.videos.length
    ? files.videos.map((v) => `<option value="${v.id}">${esc(v.path)}</option>`).join("")
    : `<option value="">No videos in Incoming yet</option>`;
  if (keep && files.videos.some((v) => v.id === keep)) $("#video").value = keep;
  if (files.outputFolder) { $("#output-link").href = files.outputFolder; $("#output-link").hidden = false; }
  document.querySelectorAll(".output").forEach(fillGraphics);
  showVideo(); validate();
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const currentVideo = () => files.videos.find((v) => v.id === $("#video").value);
function showVideo() {
  const v = currentVideo(), t = $("#video-thumb");
  if (!v) { $("#video-meta").textContent = ""; t.className = "thumb"; t.textContent = "No video picked"; return; }
  $("#video-meta").innerHTML = [
    v.duration ? `Length ${fmt(v.duration)}` : "Length not known yet",
    size(v.size), v.height ? `${v.width}×${v.height}` : "", v.modified ? `Added ${ago(v.modified)}` : "",
  ].filter(Boolean).map((x) => `<span>${x}</span>`).join("");
  if (v.thumbnail) { t.className = "thumb"; t.innerHTML = `<img alt="Thumbnail ${esc(v.thumbnail.name)}" src="${img(v.thumbnail.id)}">`; }
  else { t.className = "thumb missing"; t.textContent = "No matching thumbnail. Add one to Thumbnails with the same name."; }
}
$("#video").addEventListener("change", () => { showVideo(); validate(); });
$("#refresh").addEventListener("click", loadFiles);

// ---------- outputs
function fillGraphics(card) {
  const sel = $(".o-graphic", card), keep = sel.value;
  sel.innerHTML = `<option value="">None</option>` + files.graphics.map((g) => `<option value="${g.id}">${esc(g.name)}</option>`).join("");
  if (keep && files.graphics.some((g) => g.id === keep)) sel.value = keep;
  else if (card.dataset.wantGraphic === "first" && files.graphics[0]) sel.value = files.graphics[0].id;
  if (files.graphics.length) delete card.dataset.wantGraphic;   // keep the wish until the list has loaded
  showGraphic(card);
}
function showGraphic(card) {
  const id = $(".o-graphic", card).value, p = $(".o-gprev", card);
  p.innerHTML = id ? `<img alt="" src="${img(id)}">` : "None";
  $(".o-seconds", card).disabled = $(".o-fade", card).disabled = !id;
}
function addOutput(preset = {}) {
  const card = $("#output-tpl").content.firstElementChild.cloneNode(true);
  const n = document.querySelectorAll(".output").length + 1;
  $(".o-name", card).value = preset.name || (n === 1 ? "YouTube" : `Output ${n}`);
  $(".o-podcast", card).checked = !!preset.podcast;
  if (preset.graphic) card.dataset.wantGraphic = "first";
  card.querySelectorAll("input,select").forEach((el, i) => { el.id = `o${n}-${i}`; });
  $(".o-remove", card).addEventListener("click", () => { card.remove(); validate(); });
  $(".o-graphic", card).addEventListener("change", () => { showGraphic(card); validate(); });
  card.addEventListener("input", validate);
  $("#outputs").append(card);
  fillGraphics(card); validate();
  return card;
}
$("#add").addEventListener("click", () => $(".o-in", addOutput()).focus());

function readOutputs() {
  const v = currentVideo(), dur = v?.duration ?? null, errs = [], outs = [], names = new Set();
  document.querySelectorAll(".output").forEach((card, i) => {
    const name = $(".o-name", card).value.trim() || `Output ${i + 1}`;
    const label = `“${name}”`;
    const inEl = $(".o-in", card), outEl = $(".o-out", card);
    const a = parseTime(inEl.value), b = parseTime(outEl.value);
    let bad = [];
    if (names.has(name.toLowerCase())) errs.push(`${label}: two outputs share this name`);
    names.add(name.toLowerCase());
    if (a == null || a === "end") { bad.push(inEl); errs.push(`${label}: In needs a time like 2:45`); }
    if (b == null) { bad.push(outEl); errs.push(`${label}: Out needs a time like 41:27, or “end”`); }
    const end = b === "end" ? dur : b;
    if (typeof a === "number" && typeof end === "number") {
      if (end <= a) { bad.push(outEl); errs.push(`${label}: Out must be after In`); }
      if (dur && typeof b === "number" && b > dur + 0.05) { bad.push(outEl); errs.push(`${label}: Out is past the end of the video (${fmt(dur)})`); }
    }
    [inEl, outEl].forEach((el) => el.setAttribute("aria-invalid", bad.includes(el) ? "true" : "false"));
    const clip = typeof a === "number" && typeof end === "number" && end > a ? end - a : null;
    const gid = $(".o-graphic", card).value, g = files.graphics.find((x) => x.id === gid);
    const secs = Number($(".o-seconds", card).value), fade = Number($(".o-fade", card).value);
    if (g) {
      if (!(secs > 0)) errs.push(`${label}: graphic time must be more than 0`);
      if (!(fade >= 0)) errs.push(`${label}: crossfade can't be negative`);
      if (clip != null && fade >= clip) errs.push(`${label}: crossfade must be shorter than the clip`);
    }
    $(".o-length", card).textContent = clip != null ? `Clip ${fmt(clip)}${g ? ` + ${secs || 0}s graphic` : ""}` : "";
    outs.push({
      name, in: inEl.value.trim(), out: outEl.value.trim().toLowerCase() === "end" ? "end" : outEl.value.trim(),
      endGraphic: g ? { file: g.name, seconds: secs, crossfade: fade } : null,
      podcast: $(".o-podcast", card).checked,
    });
  });
  if (!v) errs.unshift("Pick a video");
  if (!outs.length) errs.push("Add at least one output");
  return { outs, errs };
}
function validate() {
  const { errs } = readOutputs();
  $("#errors").innerHTML = errs.map((e) => `<li>${esc(e)}</li>`).join("");
  $("#send").disabled = errs.length > 0;
}

$("#send").addEventListener("click", async () => {
  const { outs, errs } = readOutputs();
  const v = currentVideo();
  if (errs.length || !v) return validate();
  const btn = $("#send"), msg = $("#send-msg");
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    await api("/api/jobs", { method: "POST", body: JSON.stringify({
      job: { source: v.path, outputs: outs }, height: $("#height").value, label: `Render ${v.path}`,
    }) });
    msg.hidden = false; msg.className = "notice ok";
    msg.textContent = "Sent. It appears under Recent runs in a few seconds; finished files go to the Output folder.";
    setTimeout(loadRuns, 4000);
  } catch (e) {
    if (e.message === "locked") return;
    msg.hidden = false; msg.className = "notice bad"; msg.textContent = e.message;
  } finally {
    btn.textContent = "Send to render"; validate();
  }
});

// ---------- runs
const STATUS = { queued: "Queued", in_progress: "Rendering", waiting: "Waiting", pending: "Queued", requested: "Queued",
  success: "Done", failure: "Failed", cancelled: "Cancelled", timed_out: "Timed out" };
async function loadRuns() {
  let data;
  try { data = await api("/api/jobs"); }
  catch (e) { if (e.message !== "locked") $("#runs").innerHTML = `<p class="notice bad">${esc(e.message)}</p>`; return; }
  const runs = data.runs || [];
  $("#runs").innerHTML = runs.length ? runs.map((r) => {
    const key = r.status === "completed" ? r.conclusion : r.status;
    return `<div class="run"><span class="title">${esc(r.label)}</span><span class="chip ${key}">${STATUS[key] || key}</span>
      <span class="when">${ago(r.created)}</span><a href="${r.url}" target="_blank" rel="noopener">Details</a></div>`;
  }).join("") : `<p class="empty">No runs yet. Sent jobs show up here.</p>`;
  const busy = runs.some((r) => r.status !== "completed");
  clearInterval(runsTimer);
  runsTimer = setInterval(loadRuns, busy ? 15000 : 60000);
}
$("#runs-refresh").addEventListener("click", loadRuns);

// ---------- start
function start() {
  $("#gate").hidden = true; $("#app").hidden = false;
  if (!document.querySelector(".output")) addOutput({ name: "YouTube", podcast: true, graphic: true });
  loadFiles(); loadRuns();
}
if (passcode) start(); else lock("");
</script>
</body>
</html>
